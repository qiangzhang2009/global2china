<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OG Image</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #0a0e1a; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; position: relative; }
  
  /* Background pattern */
  .bg-pattern {
    position: absolute; inset: 0;
    background: 
      radial-gradient(ellipse 600px 400px at 85% 50%, rgba(201,168,76,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 400px 300px at 10% 80%, rgba(20,184,166,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 300px 300px at 20% 20%, rgba(201,168,76,0.06) 0%, transparent 60%);
  }
  
  /* Decorative circles */
  .circle-1 { position: absolute; width: 600px; height: 600px; border-radius: 50%; border: 1px solid rgba(201,168,76,0.08); top: -150px; right: -150px; }
  .circle-2 { position: absolute; width: 400px; height: 400px; border-radius: 50%; border: 1px solid rgba(201,168,76,0.05); top: -100px; right: -100px; }
  .circle-3 { position: absolute; width: 200px; height: 200px; border-radius: 50%; border: 1px solid rgba(20,184,166,0.08); bottom: -50px; left: 50px; }
  
  /* Grid */
  .grid { position: absolute; inset: 0; opacity: 0.03; background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px); background-size: 40px 40px; }
  
  /* Bottom line */
  .gold-line { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, #c9a84c 30%, #14b8a6 70%, transparent); }
  
  /* Content */
  .content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; padding: 60px 80px; }
  
  /* Logo area */
  .logo { display: flex; align-items: center; gap: 14px; margin-bottom: auto; }
  .logo-icon { width: 44px; height: 44px; background: #c9a84c; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
  .logo-text { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
  .logo-slogan { font-size: 12px; color: rgba(255,255,255,0.4); font-weight: 400; }
  
  /* Main text */
  .main-text { margin-bottom: 32px; }
  .badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(201,168,76,0.15); border: 1px solid rgba(201,168,76,0.3); border-radius: 100px; padding: 6px 16px; margin-bottom: 20px; }
  .badge-dot { width: 6px; height: 6px; background: #c9a84c; border-radius: 50%; }
  .badge-text { font-size: 11px; font-weight: 600; color: #c9a84c; letter-spacing: 2px; text-transform: uppercase; }
  .title { font-size: 64px; font-weight: 700; color: #fff; line-height: 1.05; letter-spacing: -1.5px; margin-bottom: 16px; }
  .title em { font-style: normal; color: #c9a84c; }
  .subtitle { font-size: 20px; color: rgba(255,255,255,0.45); max-width: 700px; line-height: 1.5; }
  
  /* Bottom stats */
  .stats { display: flex; gap: 48px; padding-top: 32px; border-top: 1px solid rgba(255,255,255,0.08); }
  .stat { }
  .stat-num { font-size: 28px; font-weight: 700; color: #fff; }
  .stat-label { font-size: 12px; color: rgba(255,255,255,0.35); margin-top: 2px; }
  
  /* Right side decorative text */
  .side-text { position: absolute; right: 80px; top: 50%; transform: translateY(-50%); writing-mode: vertical-rl; font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.06); letter-spacing: 4px; text-transform: uppercase; }
  
  /* Domain */
  .domain { position: absolute; right: 80px; bottom: 60px; font-size: 14px; color: rgba(255,255,255,0.25); font-weight: 500; }
</style>
</head>
<body>
  <div class="bg-pattern"></div>
  <div class="circle-1"></div>
  <div class="circle-2"></div>
  <div class="circle-3"></div>
  <div class="grid"></div>
  <div class="gold-line"></div>
  
  <div class="content">
    <!-- Logo -->
    <div class="logo">
      <div class="logo-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0a0e1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
      </div>
      <div>
        <div class="logo-text">上海张小强</div>
        <div class="logo-slogan">Global2China</div>
      </div>
    </div>
    
    <!-- Main Text -->
    <div class="main-text">
      <div class="badge">
        <div class="badge-dot"></div>
        <span class="badge-text">专业进口解决方案</span>
      </div>
      <h1 class="title">全球优品<br><em>中国上市</em></h1>
      <p class="subtitle">从日本、欧洲、东南亚选品采购到中国上市的全流程服务<br>AI智能分析 · 市场准入 · 报关清关 · 渠道对接</p>
    </div>
    
    <!-- Stats -->
    <div class="stats">
      <div class="stat">
        <div class="stat-num">50+</div>
        <div class="stat-label">覆盖国家</div>
      </div>
      <div class="stat">
        <div class="stat-num">20+</div>
        <div class="stat-label">行业经验</div>
      </div>
      <div class="stat">
        <div class="stat-num">1000+</div>
        <div class="stat-label">成功案例</div>
      </div>
    </div>
  </div>
  
  <div class="side-text">Global2China · Shanghai ZXQ Consulting</div>
  <div class="domain">global2china.zxqconsulting.com</div>
</body>
</html>
